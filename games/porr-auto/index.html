<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#cdeeff" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Põrr-auto" />
    <title>Põrr-auto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🚗%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="title" class="screen">
      <a id="cornerBtn" class="round" href="../../" data-i18n-aria="aria.corner" aria-label="Tagasi lastenurka" hidden>🏠</a>
      <div class="langs" role="group" aria-label="Keel / Language">
        <button type="button" data-lang="et">Eesti</button><button type="button" data-lang="en">English</button>
      </div>
      <div id="hero" class="hero"></div>
      <h1 data-i18n="ui.title">Põrr-auto</h1>
      <p class="sub" data-i18n="ui.tagline">Kalluta ja sõida!</p>
      <div id="colors" class="colors" role="group" data-i18n-aria="aria.color" aria-label="Auto värv"></div>
      <button id="playBtn" class="big" data-i18n="ui.play">▶ Sõida</button>
      <p id="how" class="how"></p>
      <div id="levelGrid" class="levelGrid"></div>
    </div>

    <div id="play" hidden>
      <canvas id="road"></canvas>
      <header class="top">
        <button id="levelsBtn" class="round" data-i18n-aria="aria.levels" aria-label="Tasemed">🏠</button>
        <div class="prog"><div class="progFill" id="progFill"></div><div class="progCar" id="progCar">🚗</div><div class="progEnd" id="progEnd">🏁</div></div>
        <div id="count" class="count">⭐ 0</div>
        <button id="muteBtn" class="round" data-i18n-aria="aria.sound" aria-label="Heli">🔊</button>
      </header>
      <div id="tip" class="tip"></div>
      <button id="honkBtn" class="honk" data-i18n-aria="aria.honk" aria-label="Signaal">📯</button>
    </div>

    <div id="win" class="screen overlay" hidden>
      <div class="card">
        <div id="winPic" class="winPic"></div>
        <h2 id="winTitle"></h2>
        <div id="winStars" class="winStars"></div>
        <div id="winCount" class="winCount"></div>
        <div class="btns">
          <button id="againBtn" class="big alt" data-i18n-aria="aria.again" aria-label="Uuesti">↻</button>
          <button id="nextBtn" class="big" data-i18n-aria="aria.next" aria-label="Järgmine">▶</button>
        </div>
      </div>
    </div>

    <div id="confetti"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
